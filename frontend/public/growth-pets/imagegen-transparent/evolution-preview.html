<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>成长精灵进化动效预览</title>
    <style>
      :root {
        --accent: #ff8a1f;
        --accent-soft: rgba(255, 138, 31, 0.22);
        --bg-a: #f7fbff;
        --bg-b: #fff7ed;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 28px;
        background: linear-gradient(135deg, var(--bg-a), var(--bg-b));
        color: #172033;
        font-family: Arial, "Microsoft YaHei", sans-serif;
      }

      .shell {
        width: min(920px, 100%);
        display: grid;
        gap: 18px;
      }

      .header {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 16px;
      }

      h1 {
        margin: 0;
        font-size: 24px;
      }

      .header p {
        margin: 8px 0 0;
        color: #64748b;
        line-height: 1.5;
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      button {
        border: 1px solid rgba(87, 106, 137, 0.18);
        border-radius: 8px;
        background: #fff;
        color: #24324b;
        cursor: pointer;
        font: inherit;
        font-weight: 700;
      }

      .tab {
        padding: 9px 12px;
      }

      .tab.active {
        border-color: var(--accent);
        color: #fff;
        background: var(--accent);
      }

      .play {
        padding: 11px 16px;
        border-color: var(--accent);
        color: #fff;
        background: #172033;
      }

      .stage {
        position: relative;
        min-height: 560px;
        overflow: hidden;
        border: 1px solid rgba(87, 106, 137, 0.14);
        border-radius: 8px;
        background:
          linear-gradient(45deg, rgba(226, 232, 240, 0.7) 25%, transparent 25%),
          linear-gradient(-45deg, rgba(226, 232, 240, 0.7) 25%, transparent 25%),
          linear-gradient(45deg, transparent 75%, rgba(226, 232, 240, 0.7) 75%),
          linear-gradient(-45deg, transparent 75%, rgba(226, 232, 240, 0.7) 75%),
          #fff;
        background-position: 0 0, 0 16px, 16px -16px, -16px 0;
        background-size: 32px 32px;
      }

      .aura {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 390px;
        height: 390px;
        border-radius: 50%;
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.6);
        background:
          radial-gradient(circle, rgba(255, 255, 255, 0.92) 0 14%, var(--accent-soft) 26%, transparent 68%),
          conic-gradient(from 20deg, transparent, var(--accent-soft), transparent, var(--accent-soft), transparent);
        filter: blur(0.2px);
        pointer-events: none;
      }

      .ring {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 250px;
        height: 250px;
        border: 3px solid var(--accent);
        border-radius: 50%;
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.7);
        pointer-events: none;
      }

      .pet {
        position: absolute;
        left: 50%;
        top: 50%;
        width: min(420px, 70vw);
        height: min(420px, 70vw);
        object-fit: contain;
        transform: translate(-50%, -50%);
        filter: drop-shadow(0 20px 26px rgba(15, 23, 42, 0.18));
        will-change: transform, opacity, filter;
      }

      .pet.next {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.74);
        filter: drop-shadow(0 20px 26px rgba(15, 23, 42, 0.18)) brightness(1.16);
      }

      .spark {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        opacity: 0;
        background: #fff;
        box-shadow: 0 0 16px var(--accent);
        transform: translate(-50%, -50%);
      }

      .spark:nth-of-type(1) { --tx: -180px; --ty: -128px; }
      .spark:nth-of-type(2) { --tx: -96px; --ty: -204px; }
      .spark:nth-of-type(3) { --tx: 116px; --ty: -196px; }
      .spark:nth-of-type(4) { --tx: 194px; --ty: -72px; }
      .spark:nth-of-type(5) { --tx: 176px; --ty: 124px; }
      .spark:nth-of-type(6) { --tx: 50px; --ty: 206px; }
      .spark:nth-of-type(7) { --tx: -136px; --ty: 156px; }
      .spark:nth-of-type(8) { --tx: -214px; --ty: 30px; }

      .caption {
        position: absolute;
        left: 24px;
        right: 24px;
        bottom: 20px;
        display: flex;
        justify-content: space-between;
        gap: 16px;
        color: #24324b;
        font-size: 15px;
        font-weight: 700;
      }

      .caption span {
        padding: 8px 10px;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.86);
      }

      .stage.evolving .pet.current {
        animation: oldPet 1700ms cubic-bezier(.2, .8, .2, 1) both;
      }

      .stage.evolving .pet.next {
        animation: newPet 1700ms cubic-bezier(.2, .8, .2, 1) both;
      }

      .stage.evolving .aura {
        animation: auraPulse 1700ms ease both;
      }

      .stage.evolving .ring {
        animation: ringExpand 1700ms ease both;
      }

      .stage.evolving .spark {
        animation: sparkFly 900ms ease-out both;
        animation-delay: 540ms;
      }

      @keyframes oldPet {
        0% {
          opacity: 1;
          transform: translate(-50%, -50%) scale(1);
          filter: drop-shadow(0 20px 26px rgba(15, 23, 42, 0.18)) brightness(1);
        }
        38% {
          opacity: 1;
          transform: translate(-50%, -53%) scale(0.92);
          filter: drop-shadow(0 18px 24px rgba(15, 23, 42, 0.16)) brightness(1.18) saturate(1.16);
        }
        58% {
          opacity: 0.18;
          transform: translate(-50%, -50%) scale(0.5);
          filter: blur(8px) brightness(1.8) saturate(1.3);
        }
        100% {
          opacity: 0;
          transform: translate(-50%, -50%) scale(0.45);
          filter: blur(12px) brightness(1.6);
        }
      }

      @keyframes newPet {
        0%, 48% {
          opacity: 0;
          transform: translate(-50%, -50%) scale(0.62);
          filter: blur(10px) brightness(1.9);
        }
        70% {
          opacity: 1;
          transform: translate(-50%, -52%) scale(1.08);
          filter: blur(0) brightness(1.18) saturate(1.08);
        }
        86% {
          opacity: 1;
          transform: translate(-50%, -50%) scale(0.98);
          filter: drop-shadow(0 20px 26px rgba(15, 23, 42, 0.18)) brightness(1.04);
        }
        100% {
          opacity: 1;
          transform: translate(-50%, -50%) scale(1);
          filter: drop-shadow(0 20px 26px rgba(15, 23, 42, 0.18)) brightness(1);
        }
      }

      @keyframes auraPulse {
        0% {
          opacity: 0;
          transform: translate(-50%, -50%) scale(0.5) rotate(0deg);
        }
        40% {
          opacity: 0.95;
          transform: translate(-50%, -50%) scale(0.9) rotate(90deg);
        }
        72% {
          opacity: 0.55;
          transform: translate(-50%, -50%) scale(1.22) rotate(180deg);
        }
        100% {
          opacity: 0;
          transform: translate(-50%, -50%) scale(1.5) rotate(260deg);
        }
      }

      @keyframes ringExpand {
        0%, 30% {
          opacity: 0;
          transform: translate(-50%, -50%) scale(0.66);
        }
        48% {
          opacity: 0.68;
          transform: translate(-50%, -50%) scale(1);
        }
        100% {
          opacity: 0;
          transform: translate(-50%, -50%) scale(1.95);
        }
      }

      @keyframes sparkFly {
        0% {
          opacity: 0;
          transform: translate(-50%, -50%) scale(0.6);
        }
        24% {
          opacity: 1;
        }
        100% {
          opacity: 0;
          transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(0.15);
        }
      }

      @media (max-width: 720px) {
        .header {
          align-items: stretch;
          flex-direction: column;
        }

        .stage {
          min-height: 470px;
        }

        .caption {
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <div class="header">
        <div>
          <h1>成长精灵进化动效预览</h1>
          <p>用旧阶段淡出、光效遮罩、新阶段淡入的方式模拟自然变身，不依赖视频素材。</p>
        </div>
        <div class="controls">
          <button class="tab active" data-pair="0">火 1 → 2</button>
          <button class="tab" data-pair="1">火 2 → 3</button>
          <button class="tab" data-pair="2">水 1 → 2</button>
          <button class="tab" data-pair="3">水 2 → 3</button>
          <button class="tab" data-pair="4">土 1 → 2</button>
          <button class="tab" data-pair="5">土 2 → 3</button>
          <button class="play" type="button">播放变身</button>
        </div>
      </div>

      <section class="stage" aria-live="polite">
        <div class="aura"></div>
        <div class="ring"></div>
        <div class="spark"></div>
        <div class="spark"></div>
        <div class="spark"></div>
        <div class="spark"></div>
        <div class="spark"></div>
        <div class="spark"></div>
        <div class="spark"></div>
        <div class="spark"></div>
        <img class="pet current" src="./candidate-01.png" alt="旧阶段" />
        <img class="pet next" src="./candidate-02.png" alt="新阶段" />
        <div class="caption">
          <span class="from">当前：火系阶段 1</span>
          <span class="to">进化：火系阶段 2</span>
        </div>
      </section>
    </main>

    <script>
      const pairs = [
        {
          accent: "#ff8a1f",
          soft: "rgba(255, 138, 31, 0.22)",
          bgA: "#fff7ed",
          bgB: "#fff1f2",
          from: "./candidate-01.png",
          to: "./candidate-02.png",
          fromLabel: "当前：火系阶段 1",
          toLabel: "进化：火系阶段 2",
        },
        {
          accent: "#ff8a1f",
          soft: "rgba(255, 138, 31, 0.22)",
          bgA: "#fff7ed",
          bgB: "#fff1f2",
          from: "./candidate-02.png",
          to: "./candidate-03.png",
          fromLabel: "当前：火系阶段 2",
          toLabel: "进化：火系阶段 3",
        },
        {
          accent: "#0ea5e9",
          soft: "rgba(14, 165, 233, 0.22)",
          bgA: "#eff6ff",
          bgB: "#ecfeff",
          from: "./candidate-04.png",
          to: "./candidate-05.png",
          fromLabel: "当前：水系阶段 1",
          toLabel: "进化：水系阶段 2",
        },
        {
          accent: "#0ea5e9",
          soft: "rgba(14, 165, 233, 0.22)",
          bgA: "#eff6ff",
          bgB: "#ecfeff",
          from: "./candidate-05.png",
          to: "./candidate-06.png",
          fromLabel: "当前：水系阶段 2",
          toLabel: "进化：水系阶段 3",
        },
        {
          accent: "#65a30d",
          soft: "rgba(101, 163, 13, 0.22)",
          bgA: "#f7fee7",
          bgB: "#f0fdf4",
          from: "./candidate-07.png",
          to: "./candidate-08.png",
          fromLabel: "当前：土系阶段 1",
          toLabel: "进化：土系阶段 2",
        },
        {
          accent: "#65a30d",
          soft: "rgba(101, 163, 13, 0.22)",
          bgA: "#f7fee7",
          bgB: "#f0fdf4",
          from: "./candidate-08.png",
          to: "./candidate-09.png",
          fromLabel: "当前：土系阶段 2",
          toLabel: "进化：土系阶段 3",
        },
      ];

      const stage = document.querySelector(".stage");
      const current = document.querySelector(".pet.current");
      const next = document.querySelector(".pet.next");
      const from = document.querySelector(".from");
      const to = document.querySelector(".to");
      const tabs = Array.from(document.querySelectorAll(".tab"));
      const play = document.querySelector(".play");
      let selected = 0;

      function applyPair(index) {
        selected = index;
        const pair = pairs[index];
        document.documentElement.style.setProperty("--accent", pair.accent);
        document.documentElement.style.setProperty("--accent-soft", pair.soft);
        document.documentElement.style.setProperty("--bg-a", pair.bgA);
        document.documentElement.style.setProperty("--bg-b", pair.bgB);
        current.src = pair.from;
        next.src = pair.to;
        from.textContent = pair.fromLabel;
        to.textContent = pair.toLabel;
        tabs.forEach((tab, tabIndex) => tab.classList.toggle("active", tabIndex === index));
      }

      function replay() {
        stage.classList.remove("evolving");
        current.offsetHeight;
        stage.classList.add("evolving");
      }

      tabs.forEach((tab) => {
        tab.addEventListener("click", () => {
          applyPair(Number(tab.dataset.pair));
          replay();
        });
      });

      play.addEventListener("click", replay);
      applyPair(0);
      setTimeout(replay, 400);
    </script>
  </body>
</html>
