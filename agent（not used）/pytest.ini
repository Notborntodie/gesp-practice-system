# pytest 配置文件

[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 异步测试支持
asyncio_mode = auto

# 标记分类
markers =
    unit: 单元测试
    api: API 测试
    integration: 集成测试
    e2e: 端到端测试
    performance: 性能测试
    slow: 慢速测试（可选跳过）
    mock: 使用 Mock 数据
    requires_db: 需要数据库
    requires_llm: 需要真实 LLM API（手动执行）
    requires_redis: 需要 Redis
    requires_wechat: 需要微信 Bot 环境
    negative: 负面测试（错误场景）
    ownership: 资源所有权测试
    security: 安全测试
    high_availability: 高可用测试

# 默认跳过需要真实环境和慢速测试
addopts = -v --tb=short -m "not slow and not requires_llm and not requires_redis and not requires_wechat"

# 覆盖率配置
[coverage:run]
source = local,server
omit =
    */tests/*
    */__pycache__/*
    */migrations/*

[coverage:report]
exclude_lines =
    pragma: no cover
    if __name__ == .__main__.:
    raise NotImplementedError
    @abstractmethod